# Release: builds the five binaries in release mode, packages them, writes SHA256SUMS and creates the GitHub release.
#
# How to release: bump VERSION, add the "## [X.Y.Z]" section to CHANGELOG.md, then either
#   - push the tag vX.Y.Z (it must match VERSION), or
#   - run this workflow by hand (Actions tab, "Run workflow") with "publish" ticked: it creates the tag on the selected commit.
# Without "publish" a manual run only builds the packages and keeps them as workflow artifacts. A manual publish creates a DRAFT
# release by default (untick "draft" to publish at once).
#
# A test build (no "publish") is not the release: its binaries report <version>-test.<commit> (1.22.0-test.7bc52d6, as a plain `make`
# of a commit that is not tagged v<version>) and its archives are named with it. The program saves its GPU tuning and its machine
# profile under the version it reports, so a test build measures its own instead of using the release's, and two test builds of
# different commits never look alike. A release (a tag push or "publish") reports <version> alone.
#
# A release (a tag push, or a manual run with "publish") is made only of a commit on which ci.yml has completed successfully: the first
# job looks the runs of ci.yml up for the exact commit and fails, before anything is built, when there is none, when the last one is
# still running or when none passed (a commit that changed only documents does not start the CI by itself: run it by hand on that
# commit first, Actions tab, "CI", "Run workflow"). A test build (no "publish") is not gated.
#
# The release job runs one at a time for each version (a tag push and a manual run, or two manual runs, cannot both find no release
# and create two, or replace each other's files). It also refuses to create or replace the files of a release whose tag points to
# another commit than the one this run built: the files would not come from the tagged commit, while the tag and the notes stay as
# they are. Tick "replace" in a manual run to do it on purpose; the job log says what happened.
#
# Archives (one top folder each, with the binary, README.md, LICENSE if present, CHANGELOG.md, the user documents and BUILD-INFO.txt):
# (<version> is <version>-test.<commit> for a test build)
#   pzsolve-<version>-linux-x86_64.tar.gz    pzsolve-<version>-linux-arm64.tar.gz
#   pzsolve-<version>-macos-arm64.tar.gz     pzsolve-<version>-macos-x86_64.tar.gz
#   pzsolve-<version>-windows-x86_64.zip     SHA256SUMS
# The same archives can be made on a Linux machine without Actions: tools/package_release.sh.
# The binary inside every archive is a stripped copy (tools/package_release.sh does it in the Package step, after the macOS
# signature, which it applies again); the builds themselves keep their debug information.
#
# Release builds are portable: the Makefile never passes -march=native (the program picks its SIMD engine at run time).
# Linux binaries are built on Ubuntu 22.04 so that they need at most glibc 2.34. The Windows exe is cross-compiled with
# MinGW-w64 (static runtime) and then run on a real Windows machine before it is published.
#
# macOS: the binaries get an ad-hoc signature (`codesign -s -`). That is enough to run on Apple Silicon, but they are NOT notarized:
# notarization needs a paid Apple Developer account (a "Developer ID Application" certificate, `codesign --options runtime
# --timestamp`, then `xcrun notarytool submit --wait`). Until then, a file downloaded with a browser is quarantined and Gatekeeper
# refuses it; the release notes tell users to run `xattr -dr com.apple.quarantine <folder>` (files fetched with curl or `gh release
# download` are not quarantined).
#
# macOS: both binaries are built on the Apple Silicon runner (macos-15): arm64 natively, x86_64 cross-compiled with Apple clang's -arch
# (make MACOS_ARCH=x86_64) and self-tested under Rosetta (arch -x86_64). A runner without Rosetta fails the x86_64 build job: an
# untested binary is not published. The Intel runners (macos-15-intel) are being retired and their jobs waited a quarter of an hour
# in the queue and were cancelled. Runner labels change over time (see ci.yml).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub release for the version in VERSION (creates the tag v<version> if it does not exist)'
        type: boolean
        default: false
      draft:
        description: 'Create the release as a draft'
        type: boolean
        default: true
      replace:
        description: 'Replace the files of the release of this version even though its tag points to another commit than the selected one (the tag and the notes stay as they are)'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # The gate: when the run publishes, ci.yml must have completed successfully on the commit being released. The runs are looked up
  # by their head commit (actions: read is enough; the repository is public, so the listing needs no right at all). A test build
  # (no "publish") passes through at once. The job comes first so that a red commit fails in seconds, not after an hour of builds.
  ci-green:
    name: CI passed on this commit
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: A test build is not gated
        if: ${{ !(github.ref_type == 'tag' || inputs.publish) }}
        run: echo "test build (no publish), the CI of the commit is not checked"
      - uses: actions/checkout@v7
        if: github.ref_type == 'tag' || inputs.publish
      - name: ci.yml completed successfully on the commit being released
        if: github.ref_type == 'tag' || inputs.publish
        run: |
          # the commit itself (GITHUB_SHA may name an annotated tag object): the workflow runs are filed under the commit
          SHA=$(git rev-parse "$GITHUB_SHA^{commit}")
          # every run of ci.yml for this commit (there is more than one after a re-run or a manual run): "<status> <conclusion> <event> <url>"
          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100" --jq '.workflow_runs[] | "\(.status) \(.conclusion // "none") \(.event) \(.html_url)"')
          echo "runs of ci.yml on $SHA:"
          awk 'NF { print "  " $0; n++ } END { if (!n) print "  (none)" }' <<<"$RUNS"
          HOW="Push the commit, or run the CI workflow by hand on it (Actions tab, \"CI\", \"Run workflow\"; a commit that changed only documents does not start it by itself), wait until it has passed, then start the release again."
          if [ -z "$RUNS" ]; then
            echo "::error::no run of the CI workflow (ci.yml) for commit $SHA: the release needs a green CI on the exact commit it releases. $HOW"
            exit 1
          elif grep -q '^completed success ' <<<"$RUNS"; then
            echo "the CI passed on $SHA: going on"
          elif grep -q -v '^completed ' <<<"$RUNS"; then
            echo "::error::the CI workflow (ci.yml) has not finished on commit $SHA yet ($(grep -v '^completed ' <<<"$RUNS" | awk '{print $1}' | sort -u | paste -sd,)): the release needs a green CI on the exact commit it releases. Wait until it has passed, then start the release again."
            exit 1
          else
            echo "::error::the CI workflow (ci.yml) did not pass on commit $SHA ($(awk '{print $2}' <<<"$RUNS" | sort -u | paste -sd,)): the release needs a green CI on the exact commit it releases. $HOW"
            exit 1
          fi

  # version: the one in VERSION (the release, its tag and notes); build: the one the binaries report and the archives are named with,
  # the same for a release, <version>-test.<commit> for a test build
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          PUBLISH: ${{ github.ref_type == 'tag' || inputs.publish }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version in VERSION: $VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match VERSION ($VERSION)"; exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::warning::CHANGELOG.md has no '## [$VERSION]' section: the release notes will be empty"
          fi
          if [ "$PUBLISH" = true ]; then BUILDV=$VERSION; else BUILDV="$VERSION-test.$(git rev-parse --short HEAD)"; fi
          echo "the binaries report: $BUILDV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILDV" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    needs: [version, ci-green]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: x86_64, runner: ubuntu-22.04 }
          - { os: linux,   arch: arm64,  runner: ubuntu-22.04-arm }
          - { os: macos,   arch: arm64,  runner: macos-15 }
          - { os: macos,   arch: x86_64, runner: macos-15 }       # cross-compiled (MACOS_ARCH=x86_64), self-tested under Rosetta
          - { os: windows, arch: x86_64, runner: ubuntu-24.04 }      # cross-compiled
    steps:
      - uses: actions/checkout@v7
      - name: Install MinGW-w64
        if: matrix.os == 'windows'
        run: tools/ci_apt_install.sh gcc-mingw-w64-x86-64-posix zip
      - name: Build (release, portable)
        env:
          PZV: ${{ needs.version.outputs.build }}
        run: |
          echo "::add-matcher::.github/problem-matchers/cc.json"
          if [ "${{ matrix.os }}" = windows ]; then
            make windows PZ_VERSION="$PZV" -k -j"$(nproc)" 2>&1 | tee build.log
            echo "BIN=build/win/pzsolve.exe" >> "$GITHUB_ENV"
          else
            MAKEARCH=""
            if [ "${{ matrix.os }}-${{ matrix.arch }}" = macos-x86_64 ]; then MAKEARCH="MACOS_ARCH=x86_64"; fi
            make -k -j"$( (nproc || sysctl -n hw.ncpu) 2>/dev/null | head -1)" $MAKEARCH PZ_VERSION="$PZV" 2>&1 | tee build.log
            echo "BIN=build/pzsolve" >> "$GITHUB_ENV"
          fi
      - name: The macOS binary is for ${{ matrix.arch }}
        if: matrix.os == 'macos'
        run: |
          file build/pzsolve
          lipo -archs build/pzsolve
          [ "$(lipo -archs build/pzsolve)" = "${{ matrix.arch }}" ] || { echo "::error::the binary is not for ${{ matrix.arch }}: $(lipo -archs build/pzsolve)"; exit 1; }
      - name: Ad-hoc code signature
        if: matrix.os == 'macos'
        run: |
          codesign -s - --force build/pzsolve
          codesign -v build/pzsolve
          codesign -dv build/pzsolve 2>&1 | head -5
      # The self-test gates the release. On macOS it leaves out OpenCL (Apple's deprecated framework, no usable GPU on the runners).
      # The x86_64 macOS binary is run under Rosetta on the Apple Silicon runner; without Rosetta the job fails: an untested binary
      # is not published.
      - name: Self-test
        if: matrix.os != 'windows'
        env:
          PZ_NO_OPENCL: ${{ matrix.os == 'macos' && '1' || '' }}
          PZV: ${{ needs.version.outputs.build }}
        run: |
          RUN=""
          if [ "${{ matrix.os }}-${{ matrix.arch }}" = macos-x86_64 ]; then
            if arch -x86_64 /usr/bin/true 2>/dev/null; then
              RUN="arch -x86_64"; echo "Rosetta is present: the x86_64 binary is self-tested under it (arch -x86_64)"
            else
              echo "::error::Rosetta is not installed on this runner: the x86_64 macOS binary cannot be tested here, and an untested binary is not published"; exit 1
            fi
          fi
          $RUN "$BIN" version
          $RUN "$BIN" version | sed -n 1p | grep -q "^pzsolve $PZV (" || { echo "::error::the binary does not report the version $PZV"; exit 1; }
          $RUN "$BIN" selftest
      - name: Linux binary needs no glibc newer than 2.34
        if: matrix.os == 'linux'
        run: tools/check_binary.sh linux "$BIN"
      - name: Windows exe imports only system DLLs
        if: matrix.os == 'windows'
        run: tools/check_binary.sh windows "$BIN"
      - name: Package
        env:
          PZ_VERSION: ${{ needs.version.outputs.build }}
        run: |
          export OUT=dist-release
          tools/package_release.sh --pack "$BIN" ${{ matrix.os }} ${{ matrix.arch }}
          ls -l dist-release
      - uses: actions/upload-artifact@v7
        with:
          name: pzsolve-${{ needs.version.outputs.build }}-${{ matrix.os }}-${{ matrix.arch }}
          path: dist-release/*
          if-no-files-found: error
      - name: Compiler errors
        if: failure()
        run: grep -nE 'error:|Error [0-9]+|undefined (reference|symbol)' build.log | head -100 || true
      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.os }}-${{ matrix.arch }}
          path: build.log
          if-no-files-found: ignore

  test-windows:
    name: run the Windows package on Windows
    needs: [version, build]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pzsolve-${{ needs.version.outputs.build }}-windows-x86_64
          path: pkg
      - name: Unpack
        shell: pwsh
        run: Expand-Archive -Path "pkg/pzsolve-*-windows-x86_64.zip" -DestinationPath pkg/unpacked
      - name: Self-test and smoke test
        env:
          PZV: ${{ needs.version.outputs.build }}
        run: |
          cd pkg/unpacked/pzsolve-*-windows-x86_64
          ls
          ./pzsolve.exe version
          ./pzsolve.exe version | sed -n 1p | tr -d '\r' | grep -q "^pzsolve $PZV (" || { echo "::error::the exe does not report the version $PZV"; exit 1; }
          ./pzsolve.exe selftest
          ./pzsolve.exe hunt -p 20 -c ci20 -d campaigns --ui log -q --no-gpu
          grep -qi d2c55 campaigns/ci20/FOUND.txt

  release:
    name: GitHub release
    needs: [version, build, test-windows]
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    # one run at a time for each version; a run that has to wait is not cancelled (GitHub keeps one waiting run per group, so of three
    # runs started together the one in the middle is dropped)
    concurrency:
      group: release-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: The tag must point to the commit that was built
        env:
          REPLACE: ${{ inputs.replace }}
        run: |
          TAG="v$VERSION"
          BUILT=$(git rev-parse "$GITHUB_SHA^{commit}")
          # the commit the tag points to on the server: the peeled line for an annotated tag, the plain one for a lightweight tag
          TAGSHA=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | awk 'substr($2, length($2) - 2) == "^{}" { p = $1; next } { t = $1 } END { print (p != "" ? p : t) }')
          if [ -z "$TAGSHA" ]; then
            echo "release $TAG: the tag does not exist yet, the release will create it at $BUILT (the commit this run built)"
          elif [ "$TAGSHA" = "$BUILT" ]; then
            echo "release $TAG: the tag is at $TAGSHA, the commit this run built: going on"
          elif [ "$REPLACE" = true ]; then
            echo "::warning::replace is set: the files of the release $TAG are replaced by the build of $BUILT, but the tag stays at $TAGSHA and the release notes are not changed"
          else
            echo "::error::the tag $TAG points to $TAGSHA but this run built $BUILT: the release is left as it is, because its files would not come from the tagged commit. To replace the files on purpose, run the workflow by hand with 'replace' ticked (the tag and the notes stay as they are)."
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: pzsolve-*
          path: dist-release
          merge-multiple: true
      - name: Checksums
        run: |
          ls -l dist-release
          test "$(find dist-release -maxdepth 1 -name 'pzsolve-*' | wc -l)" -eq 5 || { echo "::error::expected 5 archives"; exit 1; }
          OUT=dist-release tools/package_release.sh --sums
      - name: Release notes
        run: |
          {
            # the CHANGELOG.md section of this version
            awk -v v="$VERSION" '/^## \[/ { if (p) exit; if (index($0, "[" v "]")) p = 1 } p' CHANGELOG.md | sed '1d'
            echo
            echo "## Downloads"
            echo
            echo "| System | File |"
            echo "|--------|------|"
            echo "| Linux x86-64 | \`pzsolve-$VERSION-linux-x86_64.tar.gz\` |"
            echo "| Linux arm64 | \`pzsolve-$VERSION-linux-arm64.tar.gz\` |"
            echo "| macOS, Apple Silicon | \`pzsolve-$VERSION-macos-arm64.tar.gz\` |"
            echo "| macOS, Intel | \`pzsolve-$VERSION-macos-x86_64.tar.gz\` |"
            echo "| Windows x86-64 | \`pzsolve-$VERSION-windows-x86_64.zip\` |"
            echo
            echo "Check the download against \`SHA256SUMS\` (\`sha256sum -c SHA256SUMS\`, or \`shasum -a 256 -c SHA256SUMS\` on macOS)."
            echo
            echo "- **GPU:** CUDA and OpenCL on Linux and Windows. macOS and Linux arm64 builds run on the CPU (NEON hashing for the linear scan, portable code for the rest, slower than the AVX2/AVX-512 engines); Apple's OpenCL is tried but not supported."
            echo "- **macOS:** the binaries are signed ad hoc, not notarized. If macOS refuses to open a file downloaded with a browser, run \`xattr -dr com.apple.quarantine pzsolve-$VERSION-macos-*\` once after unpacking."
            echo "- **Windows:** the exe is not code-signed; SmartScreen may ask for \"More info\" and \"Run anyway\"."
          } > notes.md
          cat notes.md
      - name: Create or update the release
        run: |
          TAG="v$VERSION"
          # `gh release view <tag>` does not see drafts, so look the release up through the API (drafts included).
          # A published release only gets its assets replaced; a leftover draft of the same tag is replaced by a new one.
          LINE=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"" | sed -n 1p)
          if [ "${LINE#* }" = false ]; then
            gh release upload "$TAG" dist-release/* --clobber
          else
            if [ -n "$LINE" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/${LINE%% *}"; fi
            DRAFT=""
            if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.draft }}" = true ]; then DRAFT="--draft"; fi
            gh release create "$TAG" dist-release/* --title "pzsolve $VERSION" --notes-file notes.md --target "$GITHUB_SHA" $DRAFT
          fi
