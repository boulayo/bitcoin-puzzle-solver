# Continuous integration: every push and pull request builds pzsolve for the five release targets and runs its built-in
# self-test (the independent-reference checks of the field arithmetic, the hashes, every CPU engine, the kangaroo and BSGS solvers).
#
#   linux-x86_64   ubuntu-22.04      gcc, clang, and the portable scalar build (X86=0); the glibc floor is checked too, and the gcc
#                                    job also checks the puzzle database against its generator and runs the self-test through the
#                                    simulated CUDA driver (tests/mock_cuda)
#   linux-shani    ubuntu-24.04      the SHA-extension code under QEMU (make test-shani); informational, see the job
#   linux-arm64    ubuntu-22.04-arm  the portable scalar code (what Apple Silicon also runs)
#   windows-x86_64 cross-compiled with MinGW-w64 on Ubuntu, then run on a real windows-latest machine
#   macos-arm64    macos-15          Apple Silicon, Apple clang
#   macos-x86_64   macos-15          the Intel binary, cross-compiled on the Apple Silicon runner (make MACOS_ARCH=x86_64, Apple
#                                    clang's -arch) and run under Rosetta (arch -x86_64) when the runner has it
#
# Runner labels change over time (macos-13 was retired; the Intel images, macos-15-intel, are being retired and their jobs waited
# in the queue for a quarter of an hour and were cancelled, which is why the Intel binary is built on the Apple Silicon runner):
# when a job stays queued or fails with "label not found", check the current labels at https://github.com/actions/runner-images and
# update them here and in release.yml. The ubuntu-22.04-arm label is free only for public repositories.
#
# pzpeer, the daemon of the shared network (docs/en/NETWORK.md), is built and tested after pzsolve in the same jobs: its unit tests on
# Linux (with pzsign, built by cargo, on the gcc job, where the tests of the two-party signing run too), the Windows program and its
# tests built with pzsolve.exe and run on the real Windows machine, and the build and the tests on macOS. The Windows and macOS steps
# are informational (continue-on-error) until they have been seen green there: the code was written on Linux and the Windows program
# has only run under Wine.
#
# Compiler errors: the build step runs `make -k` (keeps compiling the other files after an error, so one run shows every error),
# the diagnostics become annotations through .github/problem-matchers/cc.json, and a failed build prints an error summary and
# uploads the whole log as an artifact.
#
# The CUDA code needs no toolkit here: the PTX modules are committed, the build only embeds them. That they are the ones the kernels
# generate is not checked here either (tools/gen_ptx.py --check needs NVRTC from pip, see docs/en/RELEASING.md).
#
# The docs job runs tools/check_docs.sh (the Italian guide has the sections, options and environment variables of the English one, and
# every relative link of the documents resolves). The workflow does not start for a push that changes only documents (paths-ignore,
# below), so that check runs with the next push that builds, and before every release in tools/verify.sh.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']   # a change to the documents alone does not rebuild anything
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  docs:
    name: documents (the two guides in step, links)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: tools/check_docs.sh
        run: tools/check_docs.sh

  linux:
    name: ${{ matrix.name }} (${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, variant: gcc,      runner: ubuntu-22.04,     cc: gcc,   args: '' }
          - { name: linux-x86_64, variant: clang,    runner: ubuntu-22.04,     cc: clang, args: '' }
          - { name: linux-x86_64, variant: portable, runner: ubuntu-22.04,     cc: gcc,   args: 'X86=0' }
          - { name: linux-arm64,  variant: gcc,      runner: ubuntu-22.04-arm, cc: gcc,   args: '' }
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          echo "::add-matcher::.github/problem-matchers/cc.json"
          uname -a
          ${{ matrix.cc }} --version | sed -n 1p
          make --version | sed -n 1p
      - name: Build
        run: make -k -j"$(nproc)" CC=${{ matrix.cc }} ${{ matrix.args }} 2>&1 | tee build.log
      - name: Self-test
        run: build/pzsolve selftest
      - name: Detected hardware and engines
        run: build/pzsolve devices
      - name: CPU engine speeds (informational)
        continue-on-error: true
        run: PZ_BENCH_SCALE=0.5 build/pzsolve bench
      - name: Smoke test (find the key of puzzle 20)
        run: |
          build/pzsolve hunt -p 20 -c ci20 -d "$RUNNER_TEMP/campaigns" --ui log -q --no-gpu
          grep -qi d2c55 "$RUNNER_TEMP/campaigns/ci20/FOUND.txt"
      - name: Binary needs no glibc newer than 2.34
        run: tools/check_binary.sh linux build/pzsolve
      # The unit tests gate the gcc build on x86-64. Elsewhere they are informational until the test sources build with clang and
      # without the x86 engines (tests/t_engine.c uses a nested function, tests/t_bsgs.c calls bs_group_x86 unconditionally).
      - name: Unit tests
        continue-on-error: ${{ !(matrix.name == 'linux-x86_64' && matrix.variant == 'gcc') }}
        run: make test CC=${{ matrix.cc }} ${{ matrix.args }}
      # pzpeer and its unit tests; on the gcc job also pzsign (cargo builds GMP from source the first time: some minutes), its primes
      # and with them the tests of the two-party signing and of the session
      - name: pzsign (the two-party signer)
        if: matrix.name == 'linux-x86_64' && matrix.variant == 'gcc'
        run: make signer peer-primes
      - name: pzpeer (build and unit tests)
        run: make peer-test CC=${{ matrix.cc }} ${{ matrix.args }}
      # Once per push, on the gcc build: src/puzzles_data.c is what tools/gen_puzzles.py makes of data/puzzles.csv (the generator
      # re-verifies every row with the independent implementation in tools/ref.py), and the CUDA code path (device selection, module
      # loading, launches, the kernels run on the CPU behind the driver API) passes the built-in self-test. The mock build takes
      # about 40 s and the self-test about 15 s.
      - name: Puzzle database is up to date
        if: matrix.name == 'linux-x86_64' && matrix.variant == 'gcc'
        run: python3 -I tools/gen_puzzles.py --check
      - name: Self-test through the simulated CUDA driver
        if: matrix.name == 'linux-x86_64' && matrix.variant == 'gcc'
        run: |
          make mockcuda CC=${{ matrix.cc }}
          LD_LIBRARY_PATH="$PWD/build/mockcuda" PZ_NO_OPENCL=1 build/pzsolve selftest | tee build/mockcuda-selftest.log | tail -n 4
          grep -q 'Mock CUDA GPU (CPU) via CUDA  *kernels identical to the CPU' build/mockcuda-selftest.log
      - name: Compiler errors
        if: failure()
        run: grep -nE 'error:|Error [0-9]+|undefined reference' build.log | head -100 || true
      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.name }}-${{ matrix.variant }}
          path: build.log
          if-no-files-found: ignore

  # The shani engine and the SHA-extension kernel of the library run only on a CPU that has the extensions, which the runners above
  # may or may not have. QEMU's user-mode emulator (qemu-x86_64 -cpu max) executes them anywhere, so `make test-shani` runs the library
  # tests, the shani engine test and the self-test under it (about 70 s after the build). This is a job of its own on ubuntu-24.04
  # because the engine uses AVX2 and needs a QEMU that emulates it: the one of ubuntu-24.04 is 8.2 (tried), the one of ubuntu-22.04 is
  # 6.2, which does not. Informational: the step may fail (a stalled mirror, no QEMU package) without failing the workflow.
  linux-shani:
    name: linux-x86_64 (SHA extensions under QEMU)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: make test-shani (informational)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          echo "::add-matcher::.github/problem-matchers/cc.json"
          tools/ci_apt_install.sh qemu-user
          qemu-x86_64 --version | sed -n 1p
          make -j"$(nproc)" test-shani

  windows-build:
    name: windows-x86_64 (cross-compile)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install MinGW-w64
        run: |
          # a stalled mirror must not block the job for 45 minutes: the script limits each try and retries
          tools/ci_apt_install.sh gcc-mingw-w64-x86-64-posix
          x86_64-w64-mingw32-gcc-posix --version | sed -n 1p
      - name: Build
        run: |
          echo "::add-matcher::.github/problem-matchers/cc.json"
          make windows -k -j"$(nproc)" 2>&1 | tee build.log
          make CC=x86_64-w64-mingw32-gcc-posix BUILD=build/win peer-tests -k -j"$(nproc)" 2>&1 | tee -a build.log
      - name: The exes import only system DLLs
        run: |
          tools/check_binary.sh windows build/win/pzsolve.exe
          tools/check_binary.sh windows build/win/pzpeer.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64-exe
          path: |
            build/win/pzsolve.exe
            build/win/pzpeer.exe
            build/win/peer/t_*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Compiler errors
        if: failure()
        run: grep -nE 'error:|Error [0-9]+|undefined reference' build.log | head -100 || true
      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-windows-x86_64
          path: build.log
          if-no-files-found: ignore

  windows-test:
    name: windows-x86_64 (run on Windows)
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-x86_64-exe
      - name: Self-test
        run: |
          ./pzsolve.exe version
          ./pzsolve.exe devices
          ./pzsolve.exe selftest
      - name: Smoke test (find the key of puzzle 20)
        run: |
          ./pzsolve.exe hunt -p 20 -c ci20 -d campaigns --ui log -q --no-gpu
          grep -qi d2c55 campaigns/ci20/FOUND.txt
      # Informational until seen green on a real Windows: under Wine every test passes but one check of t_sys, the stop request to a
      # child (a Ctrl-Break to its process group), which Wine does not deliver.
      - name: pzpeer (unit tests)
        continue-on-error: true
        shell: bash
        run: |
          ./pzpeer.exe version
          for t in peer/t_*.exe; do echo "== $t"; "$t" || exit 1; done

  macos:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64,  runner: macos-15, arch: arm64,  make: '' }
          - { name: macos-x86_64, runner: macos-15, arch: x86_64, make: 'MACOS_ARCH=x86_64' }   # cross-compiled, run under Rosetta
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          echo "::add-matcher::.github/problem-matchers/cc.json"
          sw_vers
          uname -m
          cc --version
          make --version | sed -n 1p
          sysctl -n machdep.cpu.brand_string
          sysctl hw.ncpu hw.physicalcpu hw.memsize
      - name: Build
        run: make -k -j"$(sysctl -n hw.ncpu)" ${{ matrix.make }} 2>&1 | tee build.log
      - name: The binary (for ${{ matrix.arch }})
        run: |
          file build/pzsolve
          lipo -archs build/pzsolve
          otool -L build/pzsolve
          [ "$(lipo -archs build/pzsolve)" = "${{ matrix.arch }}" ] || { echo "::error::the binary is not for ${{ matrix.arch }}: $(lipo -archs build/pzsolve)"; exit 1; }
          # ad-hoc signature, as in the release (no Apple Developer account involved)
          codesign -s - --force build/pzsolve
          codesign -dv build/pzsolve 2>&1 | head -5
      # The x86_64 binary runs under Rosetta on this Apple Silicon runner (arch -x86_64 makes that explicit; an x86_64-only Mach-O
      # would run under it by itself too). Without Rosetta the binary is built but not run here, with a notice; the release workflow
      # fails in that case, since it must not publish an untested binary.
      - name: Rosetta
        id: rosetta
        run: |
          if [ "${{ matrix.arch }}" = arm64 ]; then
            echo "native build: the binary runs as it is"
          elif arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta is present: the x86_64 binary is run with 'arch -x86_64'"
            echo "run=arch -x86_64" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Rosetta is not installed on this runner: the x86_64 binary is built but not run here (the release workflow fails in this case)"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Detected hardware and engines
        if: steps.rosetta.outputs.skip != '1'
        run: ${{ steps.rosetta.outputs.run }} build/pzsolve devices
      # The runners may expose a virtual GPU through Apple's OpenCL: the first self-test leaves it out so that the CPU code is
      # judged on its own, the second one lets the program try whatever OpenCL finds and does not fail the job.
      - name: Self-test (CPU)
        if: steps.rosetta.outputs.skip != '1'
        run: PZ_NO_OPENCL=1 ${{ steps.rosetta.outputs.run }} build/pzsolve selftest
      - name: Self-test (with OpenCL, informational)
        if: steps.rosetta.outputs.skip != '1'
        continue-on-error: true
        run: ${{ steps.rosetta.outputs.run }} build/pzsolve selftest
      - name: Smoke test (find the key of puzzle 20)
        if: steps.rosetta.outputs.skip != '1'
        run: |
          PZ_NO_OPENCL=1 ${{ steps.rosetta.outputs.run }} build/pzsolve hunt -p 20 -c ci20 -d "$RUNNER_TEMP/campaigns" --ui log -q --no-gpu
          grep -qi d2c55 "$RUNNER_TEMP/campaigns/ci20/FOUND.txt"
      # Informational until the test sources build with Apple clang (tests/t_engine.c uses a GCC nested function) and without the
      # x86 engines on Apple Silicon (tests/t_bsgs.c calls bs_group_x86 unconditionally). The x86_64 test programs run under Rosetta
      # by themselves (they are x86_64-only Mach-O files).
      - name: Unit tests
        if: steps.rosetta.outputs.skip != '1'
        continue-on-error: true
        run: PZ_NO_OPENCL=1 make test -k ${{ matrix.make }}
      # Informational until seen green on a Mac: pzpeer was written and run on Linux. pzsign is built by cargo for the machine itself,
      # so the tests of the two-party signing run on the native build only.
      - name: pzpeer (build and unit tests)
        if: steps.rosetta.outputs.skip != '1'
        continue-on-error: true
        run: make peer-test -k ${{ matrix.make }}
      - name: pzsign and the tests of the two-party signing
        if: matrix.arch == 'arm64'
        continue-on-error: true
        run: |
          make signer peer-primes
          make peer-test
      - name: Compiler errors
        if: failure()
        run: grep -nE 'error:|Error [0-9]+|undefined (reference|symbol)' build.log | head -100 || true
      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.name }}
          path: build.log
          if-no-files-found: ignore
      - name: Keep the binary (to try it on a real Mac)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-binary
          path: build/pzsolve
          if-no-files-found: ignore
          retention-days: 7
